{{ define "main" }}
<section class="reading">
  <header class="page-header"><h1>{{ .Title }}</h1><p class="lead">{{ .Description }}</p></header>
  <div class="article-list">{{ range .Pages }}<article class="article-row"><p class="article-meta">{{ .Params.topic }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description }}</p></article>{{ end }}</div>
</section>
{{ end }}
